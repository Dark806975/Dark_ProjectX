<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark - JARVIS Interface</title>
    <!-- Importar modelo 3D viewer de Google -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0b0f;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fondo inmersivo */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #050508 100%);
            z-index: -1;
        }

        /* Contenedor principal estilo Apple Liquid Glass */
        .glass-container {
            width: 85%;
            max-width: 900px;
            height: 80vh;
            background: rgba(20, 20, 30, 0.45);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.25);
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 40px;
            gap: 30px;
            align-items: center;
        }

        .info-section h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(180deg, #ffffff 0%, #a0a0c0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .info-section p {
            color: #9898b0;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #00e5ff;
        }

        /* Visor 3D */
        .model-box {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        /* Reproductor flotante de audio */
        .audio-dock {
            position: absolute;
            bottom: 30px;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        audio {
            height: 35px;
        }

        /* Adaptabilidad para celulares */
        @media (max-width: 768px) {
            .glass-container {
                grid-template-columns: 1fr;
                height: 90vh;
                padding: 20px;
                overflow-y: auto;
            }
            .model-box {
                height: 250px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="glass-container">
        <!-- Textos y presentación -->
        <div class="info-section">
            <span class="badge">SYSTEM: ONLINE</span>
            <h1>JARVIS // Dark</h1>
            <p>Interfaz inteligente centralizada inspirada en el diseño de cristal líquido de Apple. Desarrollado mediante la integración avanzada de inteligencias artificiales para modelado tridimensional y ambientación sonora.</p>
        </div>

        <!-- Visor del modelo 3D (puedes cambiar el link del src por tu modelo de Tripo AI en formato .glb) -->
        <div class="model-box">
            <model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" auto-rotate camera-controls disable-zoom></model-viewer>
        </div>
    </div>

    <!-- Reproductor de música (puedes poner el enlace de tu audio de Suno en el src) -->
    <div class="audio-dock">
        <span style="font-size: 0.85rem; color: #ccc;">Audio AI</span>
        <audio controls loop>
            <source src="" type="audio/mp3">
            Tu navegador no soporta audio.
        </audio>
    </div>

</body>
</html>
